<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨境商品预估售价面板</title>
<style>
:root{
  --bg:#0b0f17; --panel:#141a26; --panel2:#1b2333; --line:#26324a;
  --txt:#c7d1e0; --dim:#6b7894; --accent:#38bdf8; --accent2:#22c55e;
  --soil:#d9a545; --warn:#f59e0b; --danger:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 600px at 20% -10%,#15233b 0%,var(--bg) 55%);
  color:var(--txt);min-height:100vh;padding:28px;
}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;flex-wrap:wrap}
header h1{font-size:22px;letter-spacing:.5px}
header h1 span{color:var(--accent)}
header .sub{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:14px;color:var(--accent);margin-bottom:14px;letter-spacing:1px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.row label{font-size:13px;color:var(--txt)}
.row input[type=number]{width:120px;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);padding:7px 9px;border-radius:6px;outline:none;font-size:14px}
.row input[type=number]:focus{border-color:var(--accent)}
.row .pct{color:var(--dim);font-size:12px;width:26px}
.hint{font-size:11px;color:var(--dim);margin-bottom:14px;line-height:1.6}
.rangeRow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rangeRow input[type=range]{flex:1;accent-color:var(--accent)}
.rangeRow input[type=number]{width:80px;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);padding:7px 9px;border-radius:6px;outline:none;font-size:14px}
.rangeRow input[type=number]:focus{border-color:var(--accent)}
.rangeRow .pct{color:var(--dim);font-size:12px}
.result{text-align:center;padding:8px 0}
.price{font-size:40px;color:var(--accent2);font-weight:500;line-height:1.1}
.usd{font-size:18px;color:var(--accent);margin-top:4px}
.gross{margin-top:12px;font-size:13px;color:var(--dim)}
.gross b{color:var(--txt);font-weight:400}
.detail{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;font-size:12px;color:var(--dim)}
.detail div{display:flex;justify-content:space-between;padding:3px 0}
.detail .fr{color:var(--txt)}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(1),td:nth-child(1){text-align:left;border-right:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){padding-right:4px}
th:nth-child(3),td:nth-child(3){padding-left:4px;text-align:left;border-right:1px solid var(--line)}
th:nth-child(4),td:nth-child(4){padding-right:4px}
th:nth-child(5),td:nth-child(5){padding-left:4px;text-align:left}
th{color:var(--dim);font-weight:400;font-size:12px;letter-spacing:.5px}
td:nth-child(2),td:nth-child(3){color:var(--txt)}
td:nth-child(4),td:nth-child(5){color:var(--soil)}
td.hl{color:var(--accent2)!important}
.foot{margin-top:18px;display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:11px;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1px solid var(--line);padding:4px 10px;border-radius:20px;font-size:12px;color:var(--accent)}
.error{color:var(--danger);font-size:12px;text-align:center;padding-top:6px}
.steps{margin-top:6px;font-size:12.5px;line-height:1.9;color:var(--txt);
  font-family:Consolas,Menlo,monospace;white-space:pre-wrap;overflow:auto}
.steps .acc{color:var(--accent2)}
.steps .dim{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>跨境<span>单品售价</span>计算器</h1>
    <span class="sub">售价 = (采购+国内物流+国际物流+获客+退货预留) ÷ (1 − 平台抽佣% − 利润%)</span>
  </header>

  <div class="grid">
    <!-- 左侧 输入 -->
    <div class="panel">
      <h2>成本输入</h2>
      <div class="hint">默认填充示例值，直接修改任意项即自动重算</div>
      <div class="row"><label>采购成本 (元)</label><input type="number" id="buy" value="115" step="0.01"></div>
      <div class="row"><label>国内物流 (元)</label><input type="number" id="domestic" value="6" step="0.01"></div>
      <div class="row"><label>国际物流+货代 (元)</label><input type="number" id="intl" value="67" step="0.01"></div>
      <div class="row"><label>获客成本 (元)</label><input type="number" id="acq" value="0" step="0.01"></div>
      <div class="row"><label>退货及其他预留 (元)</label><input type="number" id="ret" value="10" step="0.01"></div>
      <div class="row">
        <label>平台抽佣</label>
        <span style="display:flex;align-items:center;gap:6px">
          <input type="number" id="commission" value="5" step="0.1" min="0" style="width:80px">
          <span class="pct">%</span>
        </span>
      </div>
      <div class="row"><label>汇率 (人民币/美元)</label><input type="number" id="rate" value="6.7" step="0.01"></div>

      <h2 style="margin-top:20px">利润率</h2>
      <div class="rangeRow">
        <input type="range" id="profitRange" min="1" max="75" step="0.5" value="20">
        <input type="number" id="profitInput" min="1" max="75" step="0.5" value="20">
        <span class="pct">%</span>
      </div>
      <div class="hint">美元价 ≈ 售价÷汇率，利润 = 售价×利润率。利润率上限 75%，越接近上限售价增速越快（分母趋零）。</div>

      <div class="result">
        <div class="price" id="priceY">264.0 元</div>
        <div class="usd" id="priceUsd">≈ 39.4 美元</div>
        <div class="gross">毛利率 =（单件售价 − 采购成本）÷ 单件售价 = <b id="grossVal">—</b></div>
        <div class="error" id="err" style="display:none"></div>
      </div>

      <div class="detail" id="detail"></div>
    </div>

    <!-- 右侧 表格 -->
    <div class="panel">
      <h2>利润档位速查表</h2>
      <div class="tableWrap">
        <table id="tbl">
          <thead>
            <tr><th>利润率</th><th>售价(元)</th><th>售价(美元)</th><th>利润(元)</th><th>利润(美元)</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <h2 style="margin-top:24px">定价推导过程</h2>
      <div class="steps" id="steps"></div>
    </div>
  </div>

  <div class="foot">
    <span class="chip">纯前端 · 数据不上传</span>
    <span id="footTip"></span>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const costs=['buy','domestic','intl','acq','ret'];
const num=id=>parseFloat($(id).value)||0;

function fmt(n){
  if(!isFinite(n)) return '—';
  const r=Math.round(n*10)/10;
  return r.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1});
}
function usd(n,r){return (n/r).toFixed(1);}

function compute(){
  const rate=num('rate')>0?num('rate'):6.7;
  const commission=Math.min(num('commission'),95)/100;
  const profit=Math.min(num('profitRange'),75)/100;
  const base=num('buy')+num('domestic')+num('intl')+num('acq')+num('ret');
  const denom=1-commission-profit;
  const err=$('err');

  if(denom<=0){
    err.style.display='block';
    err.textContent='平台抽佣+利润率 已达 100%+，价格无解，请调低';
    $('priceY').textContent='—'; $('priceUsd').textContent='—';
    $('grossVal').textContent='—';
    $('detail').innerHTML=''; renderTable(base,commission,null,rate);
    return;
  }
  err.style.display='none';
  const price=base/denom;
  $('priceY').textContent=fmt(price)+' 元';
  $('priceUsd').textContent='≈ '+usd(price,rate)+' 美元';
  $('grossVal').textContent=(Math.round(((price-num('buy'))/price)*1000)/10)+'%';
  renderSteps(base,price,profit,rate);
  renderDetail(base,price,profit,rate);
  renderTable(base,commission,profit,rate);
}

function renderDetail(base,price,profit,rate){
  const profitY=price*profit;
  $('detail').innerHTML=
    '<div><span>固定成本合计 (元)</span><span>'+fmt(base)+'</span></div>'+
    '<div><span>平台抽佣 (元)</span><span>'+fmt(price*num('commission')/100)+'</span></div>'+
    '<div><span>利润 (元)</span><span class="fr">'+fmt(profitY)+'</span></div>'+
    '<div><span>利润 (美元)</span><span class="fr">'+usd(profitY,rate)+'</span></div>'+
    '<div><span>售价合计 (元)</span><span class="fr">'+fmt(price)+'</span></div>'+
    '<div><span>售价 (美元)</span><span class="fr">'+usd(price,rate)+'</span></div>';
}

function renderSteps(base,price,profit,rate){
  const b=Math.round(base*100)/100;
  const cc=(num('commission')/100).toFixed(2).replace(/\.?0+$/,'')||'0';
  const pp=(profit*100).toFixed(1).replace(/\.0$/,'');
  const den=((1-profit-num('commission')/100)).toFixed(2).replace(/\.?0+$/,'');
  const pY=Math.round(price*100)/100;
  const pU=usd(price,rate);
  const L=[
    ['常规公式','单品售价 = 采购成本 + 国内物流 + 国际物流(含货代) + 平台抽佣 + 获客成本 + 退货预留 + 单品售价×利润百分比'],
    ['填入值后','单品售价 = '+num('buy')+' + '+num('domestic')+' + '+num('intl')+' + 单品售价×'+cc+' + '+num('acq')+' + '+num('ret')+' + 单品售价×'+pp],
    ['合并固定成本','单品售价 = '+b+' + 单品售价×'+cc+' + 单品售价×'+pp],
    ['移项求解','单品售价 × (1 − '+cc+' − '+pp+') = '+b],
    ['计算分母','单品售价 = '+b+' ÷ '+den],
    ['最终结果','单品售价 = '+pY+'元 = '+pU+'美元（利润百分比 '+pp+'%）']
  ];
  $('steps').innerHTML = L.map(r=>'<div><span class="dim">'+r[0]+'：</span><span class="acc">'+r[1]+'</span></div>').join('');
}

function renderTable(base,commission,curProfit,rate){
  const tbody=$('tbody'); tbody.innerHTML='';
  const ratio=1-commission;
  for(const p of [15,20,25,30,35,40,45,50,55,60,65,70,75]){
    const pr=p/100; if(pr>=ratio) continue;
    const price=base/(ratio-pr);
    const by=price*pr;
    const isCur=curProfit!==null && pr===curProfit;
    const tr=document.createElement('tr');
    if(isCur) tr.style.background='rgba(34,197,94,.08)';
    tr.innerHTML='<td>'+p+'%</td>'+
      '<td class="'+(isCur?'hl':'')+'">'+fmt(price)+'</td>'+
      '<td>'+usd(price,rate)+'</td>'+
      '<td>'+fmt(by)+'</td>'+
      '<td>'+usd(by,rate)+'</td>';
    tbody.appendChild(tr);
  }
}

function onRange(){
  $('profitInput').value=$('profitRange').value;
  compute();
}
function onProfitInput(){
  let v=parseFloat($('profitInput').value);
  if(isNaN(v)) return;
  v=Math.min(75,Math.max(1,v));
  $('profitRange').value=v;
  compute();
}
costs.forEach(id=>$(id).addEventListener('input',compute));
$('commission').addEventListener('input',compute);
$('rate').addEventListener('input',compute);
$('profitRange').addEventListener('input',onRange);
$('profitInput').addEventListener('input',onProfitInput);
compute();
</script>
</body>
</html>
